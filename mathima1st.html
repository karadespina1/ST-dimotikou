<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Πληροφορική ΣΤ΄ Δημοτικού - Μάθημα 1: Προβλήματα και Αλγόριθμοι</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    .font-sub {
      font-family: 'Comfortaa', cursive, sans-serif;
    }
    .btn-bounce:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-gradient-to-b from-sky-100 via-amber-50 to-emerald-50 min-h-screen text-slate-800 flex flex-col selection:bg-amber-200">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <!-- Title -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-amber-400 text-slate-900 rounded-2xl flex items-center justify-center text-2xl shadow-md">
          🤖
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="bg-amber-300 text-amber-950 text-[11px] font-extrabold px-2 py-0.5 rounded-full">ΣΤ΄ ΔΗΜΟΤΙΚΟΥ</span>
            <span class="text-blue-100 text-xs hidden sm:inline">Μάθημα 1ο</span>
          </div>
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-wide">Προβλήματα &amp; Αλγόριθμοι</h1>
        </div>
      </div>

      <!-- Score & Controls -->
      <div class="flex items-center gap-2 sm:gap-3 bg-white/20 backdrop-blur-md px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl border border-white/20">
        <div class="flex items-center gap-1.5">
          <span class="text-2xl">⭐</span>
          <span id="star-count" class="text-lg sm:text-2xl font-black text-amber-300">0</span>
          <span class="text-xs text-blue-200 font-bold">/ 24</span>
        </div>
        <div class="h-6 w-px bg-white/30 mx-1"></div>
        <button onclick="toggleAudio()" id="audio-btn" class="w-8 h-8 rounded-xl bg-white/20 hover:bg-white/30 flex items-center justify-center text-sm transition" title="Ήχος">
          <i class="fa-solid fa-volume-high" id="audio-icon"></i>
        </button>
        <button onclick="resetGame()" class="w-8 h-8 rounded-xl bg-rose-500/80 hover:bg-rose-500 flex items-center justify-center text-sm transition" title="Επανεκκίνηση">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <!-- Simple Progress Bar -->
    <div class="w-full bg-blue-950/40 h-2">
      <div id="progress-line" class="bg-amber-400 h-2 transition-all duration-300" style="width: 0%"></div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto w-full px-4 py-5 flex-1 flex flex-col gap-4">

    <!-- Top Activities Selector Carousel -->
    <div class="bg-white rounded-2xl p-2.5 shadow-sm border border-slate-200 overflow-x-auto flex gap-2" id="act-buttons-bar">
      <!-- Injected dynamically -->
    </div>

    <!-- Active Activity Box -->
    <div class="bg-white rounded-3xl p-5 sm:p-7 shadow-md border-2 border-slate-200 flex-1 flex flex-col justify-between" id="activity-card">
      
      <!-- Activity Sub-header -->
      <div>
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3 mb-4">
          <div class="flex items-center gap-3">
            <span id="act-icon" class="text-3xl">🧩</span>
            <div>
              <span id="act-tag" class="text-xs font-bold uppercase tracking-wider text-blue-600">Δραστηριοτητα 1</span>
              <h2 id="act-heading" class="text-xl sm:text-2xl font-black text-slate-800">Αλγόριθμος ή Όχι;</h2>
            </div>
          </div>

          <!-- Step Indicators (3 stars for this activity) -->
          <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-2xl">
            <span class="text-xs font-bold text-slate-500 mr-1">Επίπεδα:</span>
            <button onclick="changeSubStep(1)" id="step-btn-1" class="w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-blue-600 text-white shadow">1</button>
            <button onclick="changeSubStep(2)" id="step-btn-2" class="w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-slate-200 text-slate-600">2</button>
            <button onclick="changeSubStep(3)" id="step-btn-3" class="w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-slate-200 text-slate-600">3</button>
          </div>
        </div>

        <!-- Task Instructions -->
        <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 sm:p-4 mb-5 flex items-center gap-3">
          <span class="text-2xl">💡</span>
          <p id="act-instruction" class="text-sm sm:text-base text-amber-950 font-medium">
            Σκέψου: Μπορούμε να το λύσουμε με συγκεκριμένα βήματα (1, 2, 3...);
          </p>
        </div>

        <!-- Interactive Playground Content Area -->
        <div id="play-area" class="min-h-[220px] flex flex-col justify-center items-center">
          <!-- Dynamic Mini Game Here -->
        </div>
      </div>

      <!-- Live Feedback & Navigation -->
      <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
        <div id="feedback-msg" class="text-base sm:text-lg font-black min-h-[30px] flex items-center gap-2">
          <!-- Success / Error messages -->
        </div>

        <div class="flex items-center gap-2 ml-auto">
          <button id="btn-prev" onclick="prevAct()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition btn-bounce">
            <i class="fa-solid fa-arrow-left"></i> Πίσω
          </button>
          <button id="btn-next" onclick="nextAct()" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-sm transition btn-bounce shadow-md">
            Επόμενο <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>

    </div>

  </main>

  <!-- Big Victory Modal -->
  <div id="win-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl border-4 border-amber-400 transform animate-bounce">
      <div class="text-6xl mb-2">🎉</div>
      <h3 class="text-2xl font-black text-slate-800">ΜΠΡΑΒΟ!</h3>
      <p class="text-sm text-slate-600 my-3">
        Κέρδισες και τα <strong>24 χρυσά αστέρια</strong>! Είσαι πλέον ένας σούπερ βοηθός του υπολογιστή!
      </p>
      <button onclick="closeWinModal()" class="w-full py-3 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-900 font-black rounded-2xl shadow hover:brightness-105 transition">
        Παίξε Ξανά! 🚀
      </button>
    </div>
  </div>

  <script>
    // --- Web Audio Simple Sound Generator ---
    let soundEnabled = true;
    let audioCtx = null;

    function playTone(freqs, type = 'sine', duration = 0.15) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let now = audioCtx.currentTime;
        freqs.forEach((f, idx) => {
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + duration);
        });
      } catch (e) {}
    }

    function soundRight() { playTone([523, 659, 784, 1046], 'triangle', 0.25); }
    function soundWrong() { playTone([220, 180], 'sawtooth', 0.2); }
    function soundPop() { playTone([600], 'sine', 0.08); }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      document.getElementById('audio-icon').className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-rose-300';
    }

    // --- State & Progress (24 Stars) ---
    let curAct = 1;
    let curSub = 1;
    let stars = JSON.parse(localStorage.getItem('inf_dimotiko_m1_stars') || '{}');

    function saveStars() {
      localStorage.setItem('inf_dimotiko_m1_stars', JSON.stringify(stars));
      updateScoreUI();
    }

    function earnStar(act, sub) {
      let key = `${act}_${sub}`;
      if (!stars[key]) {
        stars[key] = true;
        saveStars();
        soundRight();
        confetti({ particleCount: 35, spread: 55, origin: { y: 0.8 } });
      }
    }

    function updateScoreUI() {
      let count = Object.keys(stars).length;
      document.getElementById('star-count').textContent = count;
      document.getElementById('progress-line').style.width = `${(count / 24) * 100}%`;

      if (count === 24 && !sessionStorage.getItem('m1_cleared')) {
        sessionStorage.setItem('m1_cleared', 'true');
        document.getElementById('win-modal').classList.remove('hidden');
        confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
      }
      renderNav();
    }

    function closeWinModal() {
      document.getElementById('win-modal').classList.add('hidden');
    }

    function resetGame() {
      if (confirm('Θέλεις να ξεκινήσεις από την αρχή όλα τα παιχνίδια;')) {
        stars = {};
        sessionStorage.removeItem('m1_cleared');
        saveStars();
        renderView();
      }
    }

    // --- 8 Activities Overview ---
    const acts = [
      { id: 1, name: "Αλγόριθμος ή Όχι;", icon: "🤔", desc: "Μπορούμε να το λύσουμε με συγκεκριμένα βήματα (1, 2, 3...);" },
      { id: 2, name: "Η Σωστή Σειρά!", icon: "🚴", desc: "Βάλε τα 3 βήματα του αλγορίθμου στη σωστή σειρά!" },
      { id: 3, name: "Ο Κουμπαράς", icon: "🐷", desc: "Πρόσθεσε χρήματα και δες πώς αλλάζει το άθροισμα!" },
      { id: 4, name: "Ποιος Κερδίζει;", icon: "🏆", desc: "Σύγκρινε δύο ομάδες και βρες ποια έχει τις περισσότερες νίκες!" },
      { id: 5, name: "Ονόματα Μεταβλητών", icon: "🏷️", desc: "Θυμήσου τον χρυσό κανόνα: Ποτέ κενό ανάμεσα στις λέξεις!" },
      { id: 6, name: "Είσοδος - Έξοδος", icon: "💻", desc: "Τι μπαίνει, τι υπολογίζεται και τι βγαίνει στην οθόνη;" },
      { id: 7, name: "Ο Μέσος Όρος", icon: "⚖️", desc: "Μοιράζουμε δίκαια: Όλο το Άθροισμα διά το Πλήθος!" },
      { id: 8, name: "Το Τετράγωνο", icon: "🟩", desc: "Περίμετρος = 4 φορές την πλευρά! Βρες το αποτέλεσμα!" }
    ];

    function renderNav() {
      const bar = document.getElementById('act-buttons-bar');
      bar.innerHTML = '';
      acts.forEach(a => {
        let done = (stars[`${a.id}_1`]?1:0) + (stars[`${a.id}_2`]?1:0) + (stars[`${a.id}_3`]?1:0);
        let btn = document.createElement('button');
        btn.onclick = () => { soundPop(); curAct = a.id; curSub = 1; renderView(); };
        btn.className = `px-3 py-2 rounded-xl text-xs font-black whitespace-nowrap transition flex items-center gap-1.5 ${
          curAct === a.id ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 hover:bg-slate-200 text-slate-700'
        }`;
        btn.innerHTML = `<span>${a.icon}</span> <span>${a.id}. ${a.name}</span> <span class="text-amber-400 font-extrabold text-[11px]">${done}/3⭐</span>`;
        bar.appendChild(btn);
      });
    }

    function changeSubStep(num) {
      soundPop();
      curSub = num;
      renderView();
    }

    function prevAct() {
      if (curSub > 1) { curSub--; }
      else if (curAct > 1) { curAct--; curSub = 3; }
      soundPop();
      renderView();
    }

    function nextAct() {
      if (curSub < 3) { curSub++; }
      else if (curAct < 8) { curAct++; curSub = 1; }
      soundPop();
      renderView();
    }

    // --- Main View Renderer ---
    function renderView() {
      const act = acts[curAct - 1];
      document.getElementById('act-icon').textContent = act.icon;
      document.getElementById('act-tag').textContent = `Δραστηριοτητα ${act.id} • Μερος ${curSub}/3`;
      document.getElementById('act-heading').textContent = act.name;
      document.getElementById('act-instruction').textContent = act.desc;
      document.getElementById('feedback-msg').textContent = '';

      // Update Step buttons 1, 2, 3
      for (let s = 1; s <= 3; s++) {
        const btn = document.getElementById(`step-btn-${s}`);
        const isDone = stars[`${curAct}_${s}`];
        if (s === curSub) {
          btn.className = "w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-blue-600 text-white shadow-md ring-2 ring-blue-300";
        } else if (isDone) {
          btn.className = "w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-emerald-500 text-white";
        } else {
          btn.className = "w-8 h-8 rounded-xl font-black text-xs transition flex items-center justify-center bg-slate-200 text-slate-600 hover:bg-slate-300";
        }
        btn.innerHTML = isDone ? '⭐' : s;
      }

      // Prev / Next button states
      document.getElementById('btn-prev').disabled = (curAct === 1 && curSub === 1);
      document.getElementById('btn-next').disabled = (curAct === 8 && curSub === 3);

      // Render the current task
      const playArea = document.getElementById('play-area');
      playArea.innerHTML = '';
      handlers[`${curAct}_${curSub}`](playArea);
    }

    function showFeedback(ok, text) {
      const el = document.getElementById('feedback-msg');
      if (ok) {
        el.className = "text-base sm:text-lg font-black text-emerald-600 flex items-center gap-2";
        el.innerHTML = `<span>🎉</span> <span>${text}</span>`;
      } else {
        el.className = "text-base sm:text-lg font-black text-rose-500 flex items-center gap-2";
        el.innerHTML = `<span>❌</span> <span>${text}</span>`;
      }
    }

    // =========================================================================
    // 24 MINI-TASKS (SIMPLE, 1-2 CLICKS FOR 6th GRADERS)
    // =========================================================================
    const handlers = {};

    /* --- ΔΡΑΣΤΗΡΙΟΤΗΤΑ 1: Αλγόριθμος ή Όχι; --- */
    function makeYesNoQuestion(area, question, isAlgo, explain) {
      area.innerHTML = `
        <div class="text-center max-w-lg">
          <div class="text-4xl mb-3">🧐</div>
          <h3 class="text-xl sm:text-2xl font-black text-slate-800 mb-6">«${question}»</h3>
          <p class="text-slate-500 text-sm mb-6">Μπορεί αυτό το πρόβλημα να λυθεί ακολουθώντας συγκεκριμένα βήματα (αλγόριθμο);</p>
          <div class="flex justify-center gap-4">
            <button onclick="answer1(true)" class="px-6 py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg rounded-2xl shadow-lg transition btn-bounce flex items-center gap-2">
              <span>👍</span> ΝΑΙ, με Αλγόριθμο!
            </button>
            <button onclick="answer1(false)" class="px-6 py-4 bg-rose-500 hover:bg-rose-600 text-white font-black text-lg rounded-2xl shadow-lg transition btn-bounce flex items-center gap-2">
              <span>👎</span> ΟΧΙ, δεν έχει βήματα!
            </button>
          </div>
        </div>
      `;
      window.answer1 = function(userPick) {
        if (userPick === isAlgo) {
          showFeedback(true, `Μπράβο! ${explain}`);
          earnStar(curAct, curSub);
        } else {
          soundWrong();
          showFeedback(false, `Ξανασκέψου το! Μπορούμε να γράψουμε βήματα 1, 2, 3 για αυτό;`);
        }
      };
    }

    handlers['1_1'] = (a) => makeYesNoQuestion(a, "Συνταγή για να φτιάξω ένα τοστ", true, "Έχει σαφή βήματα: 1. Ψωμί, 2. Τυρί, 3. Ψήσιμο!");
    handlers['1_2'] = (a) => makeYesNoQuestion(a, "Ξέχασα το φαγητό στο σπίτι και έφτασα στο σχολείο", false, "Εδώ δεν υπάρχει σειρά βημάτων που να φέρνει μαγικά το φαγητό!");
    handlers['1_3'] = (a) => makeYesNoQuestion(a, "Υπολογισμός των χρημάτων που ξόδεψα σε 5 ημέρες", true, "Μαζεύουμε τα ποσά και τα προσθέτουμε ένα-ένα με βήματα!");

    /* --- ΔΡΑΣΤΗΡΙΟΤΗΤΑ 2: Η Σωστή Σειρά (Ρόδα Ποδηλάτου) --- */
    function makeOrderTask(area, prompt, correctArr, items) {
      let chosen = [];
      area.innerHTML = `
        <div class="w-full max-w-xl text-center">
          <p class="text-sm text-slate-600 mb-4 font-bold">${prompt}</p>
          <div class="space-y-2 mb-4" id="order-box">
            <!-- Selected items display -->
          </div>
          <div class="flex flex-col gap-2" id="source-steps">
            ${items.map(it => `
              <button onclick="pickStep('${it.id}')" id="btn-step-${it.id}" class="w-full text-left p-3.5 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-2xl text-sm font-bold text-slate-700 transition flex items-center justify-between">
                <span>${it.text}</span>
                <span class="text-xs text-blue-600 font-black">Πάτησέ με! 👆</span>
              </button>
            `).join('')}
          </div>
          <button onclick="resetOrder()" class="mt-4 text-xs font-bold text-rose-500 hover:underline">
            🔄 Ξεκίνα ξανά τη σειρά
          </button>
        </div>
      `;

      function renderChosen() {
        const ob = document.getElementById('order-box');
        if (chosen.length === 0) {
          ob.innerHTML = `<div class="p-4 border-2 border-dashed border-slate-200 rounded-2xl text-xs text-slate-400">Πάτησε τα παρακάτω κουμπιά με τη σωστή σειρά (1ο, 2ο, 3ο)...</div>`;
        } else {
          ob.innerHTML = chosen.map((id, idx) => {
            let item = items.find(x => x.id === id);
            return `<div class="p-3 bg-blue-600 text-white rounded-xl text-sm font-black flex items-center justify-between animate-fadeIn">
              <span>${idx + 1}. ${item.text}</span>
              <span>✅</span>
            </div>`;
          }).join('');
        }
      }
      renderChosen();

      window.pickStep = function(id) {
        soundPop();
        if (chosen.includes(id)) return;
        chosen.push(id);
        document.getElementById(`btn-step-${id}`).classList.add('opacity-30', 'pointer-events-none');
        renderChosen();

        if (chosen.length === 3) {
          if (chosen.join('') === correctArr.join('')) {
            showFeedback(true, "Τέλεια! Αυτή είναι η σωστή σειρά εκτέλεσης!");
            earnStar(curAct, curSub);
          } else {
            soundWrong();
            showFeedback(false, "Λάθος σειρά! Σκέψου: Τι πρέπει να μάθουμε ΠΡΩΤΑ απ' όλα;");
          }
        }
      };

      window.resetOrder = function() {
        soundPop();
        chosen = [];
        items.forEach(it => {
          let b = document.getElementById(`btn-step-${it.id}`);
          if (b) b.classList.remove('opacity-30', 'pointer-events-none');
        });
        renderChosen();
        document.getElementById('feedback-msg').textContent = '';
      };
    }

    handlers['2_1'] = (a) => makeOrderTask(a, "Βάλε στη σειρά τα βήματα για να βρούμε το μήκος της ρόδας:", ['A', 'B', 'C'], [
      { id: 'B', text: 'Όρισε το μήκος σε 2 * 3,14 * ακτίνα' },
      { id: 'A', text: 'Διάβασε την ακτίνα της ρόδας (από το πληκτρολόγιο)' },
      { id: 'C', text: 'Γράψε το μήκος της ρόδας (στην οθόνη)' }
    ]);

    handlers['2_2'] = (a) => makeOrderTask(a, "Τι πρέπει να κάνουμε ΠΡΩΤΟ για να υπολογίσουμε τη ρόδα;", ['X', 'Y', 'Z'], [
      { id: 'Y', text: 'Βήμα 2: Κάνε τον πολλαπλασιασμό' },
      { id: 'Z', text: 'Βήμα 3: Δείξε το αποτέλεσμα στην οθόνη' },
      { id: 'X', text: 'Βήμα 1: Ρώτησε πόσα εκατοστά είναι η ακτίνα' }
    ]);

    handlers['2_3'] = (a) => makeOrderTask(a, "Πώς τελειώνει πάντα ένας χρήσιμος αλγόριθμος;", ['1', '2', '3'], [
      { id: '2', text: 'Υπολογισμός αποτελέσματος' },
      { id: '1', text: 'Είσοδος δεδομένων' },
      { id: '3', text: 'Εμφάνιση του τελικού αποτελέσματος στο παιδί' }
    ]);

    /* --- ΔΡΑΣΤΗΡΙΟΤΗΤΑ 3: Ο Κουμπαράς (Άθροισμα) --- */
    handlers['3_1'] = function(area) {
      let total = 0;
      area.innerHTML = `
        <div class="text-center max-w-sm">
          <div class="text-6xl mb-2">🐷</div>
          <span class="text-xs uppercase font-extrabold text-amber-800 bg-amber-100 px-3 py-1 rounded-full">Μεταβλητή: άθροισμα</span>
