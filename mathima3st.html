<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Μάθημα 3: Είσοδος & Έξοδος στο Scratch - Διαδραστικά Εργαστήρια</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --scratch-orange: #ffab19;
      --scratch-blue: #4cbfe6;
      --scratch-purple: #9966ff;
      --scratch-green: #59c059;
      --scratch-var: #ff8c1a;
      --scratch-event: #ffd233;
      --bg-base: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #cbd5e1;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-shell {
      width: 100%;
      max-width: 940px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Console Bar */
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cat-badge {
      background: linear-gradient(135deg, #ff8c00, #ffab19);
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
    }

    .brand-title h1 {
      font-size: 1.35rem;
      color: #ffffff;
    }

    .brand-title p {
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .score-chip {
      background: rgba(255, 171, 25, 0.15);
      border: 1px solid var(--scratch-orange);
      color: #fde047;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Map of Labs (8 Missions) */
    .mission-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 650px) {
      .mission-nav {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .nav-station {
      background: rgba(30, 41, 59, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-station:hover {
      background: rgba(79, 70, 229, 0.25);
      border-color: #6366f1;
      color: white;
    }

    .nav-station.active {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      border-color: #818cf8;
      color: white;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    .nav-station.is-done .check-icon {
      color: #4ade80;
    }

    /* Mission Workstation Arena */
    .workbench {
      background: #ffffff;
      color: var(--text-main);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .mission-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .mission-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1e1b4b;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sub-switch {
      display: flex;
      gap: 6px;
    }

    .sub-step-btn {
      background: #f1f5f9;
      border: 2px solid transparent;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
      color: #64748b;
      transition: all 0.2s;
    }

    .sub-step-btn.active {
      background: #4f46e5;
      color: white;
    }

    .sub-step-btn.done {
      background: #dcfce7;
      color: #15803d;
      border-color: #86efac;
    }

    .briefing {
      background: #f8fafc;
      border-left: 5px solid #6366f1;
      padding: 12px 18px;
      border-radius: 0 12px 12px 0;
      font-size: 1.02rem;
      color: #334155;
      margin-bottom: 20px;
    }

    /* Scratch Stylized Blocks */
    .sb-block {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 0.95rem;
      box-shadow: 0 3px 0 rgba(0,0,0,0.18);

    .sb-sensing { background-color: #4cbfe6; border: 1px solid #2e8eb0; }
    .sb-looks { background-color: #9966ff; border: 1px solid #774dc1; }
    .sb-operators { background-color: #59c059; border: 1px solid #389438; }
    .sb-variables { background-color: #ff8c1a; border: 1px solid #db6e00; }
    .sb-events { background-color: #ffd233; color: #403000; border: 1px solid #d4a511; }

    .sb-input {
      background: white;
      color: #0f172a;
      padding: 2px 10px;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      font-size: 0.9rem;
      display: inline-block;
    }

    /* Interactive Mechanism: Drag/Click Connectors & Matchers */
    .field-area {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 220px;

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;

    @media (min-width: 600px) {
      .options-grid.two-cols {

      border: 2px solid #cbd5e1;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: bold;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      transition: all 0.2s ease;
    }

    .click-choice:hover {
      border-color: #6366f1;
      background: #f5f3ff;
      transform: translateY(-2px);
    }

    .click-choice.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
    }

    .click-choice.wrong {
      background: #fee2e2 !important;
      border-color: #f43f5e !important;
      color: #9f1239 !important;
    }

    /* Scratch Live Stage Simulator */
    .scratch-stage-box {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
    }

    .stage-cat {
      font-size: 4.5rem;
      animation: catFloat 2.2s infinite ease-in-out;
    }

    @keyframes catFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .cat-bubble {
      background: #ffffff;
      border: 3px solid #334155;
      padding: 12px 22px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #1e293b;
      position: relative;
      max-width: 85%;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .cat-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: #ffffff transparent;
    }

    .stage-controls {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 380px;
      margin-top: 10px;
    }

    .stage-controls input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid #94a3b8;
      font-size: 1.05rem;
      outline: none;
      font-family: inherit;
    }

    .stage-controls input:focus {
      border-color: #4cbfe6;
    }

    .stage-controls button {
      background: #4cbfe6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .live-vars-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 12px;
    }

    /* Feedback Banner */
    .status-alert {
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.98rem;
      margin-top: 18px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status-alert.show-win {
      display: flex;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .status-alert.show-err {
      display: flex;
      background: #ffe4e6;
      color: #be123c;
      border: 1px solid #fda4af;
    }

    /* Navigation Footer */
    .stage-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;

    .primary-btn {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
    }

    .ghost-btn {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .ghost-btn:hover {
      background: #e2e8f0;
    }
  </style>
</head>

  <script>
    // Audio Synthesizer (Web Audio API)
    let audioContext = null;
    function beep(type) {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);

        if (type === 'win') {
          osc.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(1046.5, audioContext.currentTime + 0.25); // C6
          gain.gain.setValueAtTime(0.2, audioContext.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.3);
          osc.start();
          osc.stop(audioContext.currentTime + 0.3);
        } else {
          osc.frequency.setValueAtTime(240, audioContext.currentTime);
          osc.frequency.linearRampToValueAtTime(150, audioContext.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, audioContext.currentTime);
          gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.25);
          osc.start();
          osc.stop(audioContext.currentTime + 0.25);
        }
      } catch (e) {}
    }

    // Render Sub-Step
    function renderWorkplace() {
      const mission = missionsData[activeMission];
      const step = mission.steps[activeSub - 1];
      const subKey = `${activeMission}-${activeSub}`;

      document.getElementById('m-title').innerHTML = mission.title;

      // Sub tabs state
      for (let s = 1; s <= 3; s++) {
        const btn = document.getElementById(`sub-dot-${s}`);
        btn.className = `sub-step-btn ${s === activeSub ? 'active' : ''} ${earnedStars.has(`${activeMission}-${s}`) ? 'done' : ''}`;
      }

      let html = `<div class="briefing">${step.prompt}</div>`;

      // 1. Multiple Choice
      if (step.type === 'choice') {
        html += `<div class="options-grid">`;
        step.options.forEach(opt => {
          html += `
            <button class="click-choice" onclick="checkChoiceAnswer(this, ${opt.isCorrect})">
              <span>🔘</span> <span>${opt.label}</span>
            </button>
          `;
        });
        html += `</div>`;
      }

      // 2. Category Quiz
      else if (step.type === 'category-quiz') {
        html += `
          <div class="field-area" style="text-align: center; align-items: center;">
            <div style="margin-bottom: 12px;">
              <span class="sb-block" style="background:#1e293b; font-size:1.15rem; padding: 12px 20px;">
                ${step.block}
              </span>
            </div>
            <div style="font-weight: bold; color: #64748b; margin-bottom: 8px;">Διάλεξε τη σωστή κατηγορία:</div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
        `;
        step.categories.forEach(cat => {
          html += `
            <button class="click-choice" style="background: ${cat.color}; color: white; border: none; font-size: 1rem;" onclick="checkCategoryAnswer(this, ${cat.isCorrect})">
              📁 ${cat.name}
            </button>
          `;
        });
        html += `</div></div>`;
      }

      // 3. Scratch Stage Simulator (Act 6)
      else if (step.type === 'interactive-sim') {
        html += `
          <div class="scratch-stage-box">
            <div class="cat-bubble" id="sim-bubble">🐱 Γεια σου! Πώς σε λένε;</div>
            <div class="stage-cat">🐱</div>
            <div class="stage-controls">
              <input type="text" id="sim-text-in" placeholder="Γράψε εδώ..." autofocus onkeydown="if(event.key==='Enter') executeSim()">
              <button onclick="executeSim()">✔</button>
            </div>
            <div class="live-vars-row">
              <span class="sb-block sb-sensing">απάντηση = <span class="sb-input" id="lbl-ans">...</span></span>
              <span class="sb-block sb-variables">μήκος κύκλου = <span class="sb-input" id="lbl-res">...</span></span>
            </div>
          </div>
        `;
      }

      // 4. Sequence of Blocks (Act 7.1)
      else if (step.type === 'block-sequence') {
        html += `
          <div class="field-area">
            <div style="font-weight: bold; color: #64748b;">Πάτα διαδοχικά τα μπλοκ για να τα βάλεις στη σωστή σειρά εκτέλεσης:</div>
            <div style="display: flex; flex-direction: column; gap: 8px; margin: 12px 0;" id="seq-pool">
        `;
        step.blocks.forEach(b => {
          html += `
            <div class="click-choice" id="${b.id}" style="background: ${b.color}; color: ${b.fontColor || '#ffffff'}; border: none;" onclick="pickSeqBlock(this, '${b.id}')">
              ${b.text}
            </div>
          `;
        });
        html += `
            </div>
            <div style="display: flex; gap: 10px;">
              <button class="primary-btn" onclick="checkSeqOrder()">Έλεγχος Σειράς</button>
              <button class="ghost-btn" onclick="renderWorkplace()">🔄 Καθαρισμός</button>
            </div>
          </div>
        `;
      }

      html += `<div class="status-alert" id="status-box"></div>`;
      document.getElementById('mission-body').innerHTML = html;

      if (step.type === 'interactive-sim') {
        configSim();
      }
    }

    // Evaluation Handlers
    function checkChoiceAnswer(btn, isOk) {
      const subKey = `${activeMission}-${activeSub}`;
      const step = missionsData[activeMission].steps[activeSub - 1];
      const box = document.getElementById('status-box');
      const allChoices = document.querySelectorAll('.click-choice');

      if (isOk) {
        allChoices.forEach(c => c.classList.remove('wrong'));
        btn.classList.add('correct');
        box.className = 'status-alert show-win';
        box.innerHTML = `<span>🎉</span> <span>${step.okMsg}</span>`;
        beep('win');
        unlockStar(subKey);
      } else {
        btn.classList.add('wrong');
        box.className = 'status-alert show-err';
        box.innerHTML = `<span>❌</span> <span>${step.errMsg}</span>`;
        beep('err');
      }
    }

    function checkCategoryAnswer(btn, isOk) {
      const subKey = `${activeMission}-${activeSub}`;
      const step = missionsData[activeMission].steps[activeSub - 1];
      const box = document.getElementById('status-box');

      if (isOk) {
        box.className = 'status-alert show-win';
        box.innerHTML = `<span>🎉</span> <span>${step.okMsg}</span>`;
        beep('win');
        unlockStar(subKey);
      } else {
        box.className = 'status-alert show-err';
        box.innerHTML = `<span>❌</span> <span>${step.errMsg}</span>`;
        beep('err');
      }
    }

    // Live Simulator Logic
    let studentName = "";
    function configSim() {
      const bubble = document.getElementById('sim-bubble');
      const input = document.getElementById('sim-text-in');
      if (!bubble || !input) return;

      if (activeSub === 1) {
        bubble.innerText = "🐱 Γεια σου! Πώς σε λένε και περίμενε...";
        input.placeholder = "Γράψε το όνομά σου...";
      } else if (activeSub === 2) {
        bubble.innerText = `🐱 Χαίρομαι ${studentName || 'φίλε μου'}! Δώσε την ακτίνα του κύκλου σε εκ.:`;
        input.placeholder = "π.χ. 10";
      } else if (activeSub === 3) {
        bubble.innerText = "🐱 Δώσε άλλη μία ακτίνα (π.χ. 5) για νέο υπολογισμό:";
        input.placeholder = "π.χ. 5";
      }
    }

    function executeSim() {
      const input = document.getElementById('sim-text-in');
      const val = input.value.trim();
      const bubble = document.getElementById('sim-bubble');
      const ansLabel = document.getElementById('lbl-ans');
      const resLabel = document.getElementById('lbl-res');
      const box = document.getElementById('status-box');
      const subKey = `${activeMission}-${activeSub}`;

      if (!val) return;
      ansLabel.innerText = val;

      if (activeSub === 1) {
        studentName = val;
        bubble.innerText = `🐱 Γεια σου ${studentName}! Θα υπολογίσω για σένα το μήκος κύκλου (2*3.14*ρ)!`;
        box.className = 'status-alert show-win';
        box.innerHTML = "<span>🎉</span> <span>Μπράβο! Το όνομα αποθηκεύτηκε στην «απάντηση» και εμφανίστηκε με την «πες»!</span>";
        beep('win');
        unlockStar(subKey);
      } else {
        const r = parseFloat(val);
        if (isNaN(r) || r <= 0) {
          box.className = 'status-alert show-err';
          box.innerHTML = "<span>❌</span> <span>Δώσε έναν έγκυρο θετικό αριθμό!</span>";
          beep('err');
          return;
        }
        const perimeter = (2 * 3.14 * r).toFixed(2);
        resLabel.innerText = perimeter + " εκ.";
        bubble.innerText = `🐱 Ο κύκλος έχει μήκος ${perimeter} εκατοστά!`;
        box.className = 'status-alert show-win';
        box.innerHTML = `<span>🎉</span> <span>Υπολογισμός: 2 * 3.14 * ${r} = ${perimeter} εκ.!</span>`;
        beep('win');
        unlockStar(subKey);
      }
      input.value = "";
    }

    // Sequence Builder Logic (Act 7.1)
    let userSeq = [];
    function pickSeqBlock(el, id) {
      if (userSeq.includes(id)) return;
      userSeq.push(id);
      el.style.opacity = '0.5';
      el.style.transform = 'scale(0.98)';
    }

    function checkSeqOrder() {
      const box = document.getElementById('status-box');
      const step = missionsData[activeMission].steps[activeSub - 1];
      const subKey = `${activeMission}-${activeSub}`;

      if (userSeq.length < 4) {
        box.className = 'status-alert show-err';
        box.innerHTML = '⚠️ Πάτησε και τα 4 μπλοκ με τη σειρά πριν πατήσεις έλεγχο!';
        return;
      }

      let isCorrect = true;
      for (let i = 0; i < 4; i++) {
        if (userSeq[i] !== step.targetOrder[i]) isCorrect = false;
      }

      if (isCorrect) {
        box.className = 'status-alert show-win';
        box.innerHTML = `<span>🎉</span> <span>${step.okMsg}</span>`;
        beep('win');
        unlockStar(subKey);
      } else {
        box.className = 'status-alert show-err';
        box.innerHTML = `<span>❌</span> <span>${step.errMsg}</span>`;
        beep('err');
      }
    }

    // Star Tracker & Station Update
    function unlockStar(subKey) {
      if (!earnedStars.has(subKey)) {
        earnedStars.add(subKey);
        document.getElementById('star-counter').innerText = earnedStars.size;

        let allDone = true;
        for (let s = 1; s <= 3; s++) {
          if (!earnedStars.has(`${activeMission}-${s}`)) allDone = false;
        }
        if (allDone) {
          const stBtn = document.getElementById(`btn-m${activeMission}`);
          stBtn.querySelector('.check-icon').innerText = '⭐';
          stBtn.classList.add('is-done');
        }

        renderWorkplace();
      }
    }

    // Navigation Logic
    function jumpMission(mNum) {
      activeMission = mNum;
      activeSub = 1;
      userSeq = [];
      document.querySelectorAll('.nav-station').forEach((b, idx) => {
        b.classList.toggle('active', (idx + 1) === mNum);
      });
      renderWorkplace();
    }

    function jumpSub(sNum) {
      activeSub = sNum;
      userSeq = [];
      renderWorkplace();
    }

    function stepNav(direction) {
      if (direction === 1) {
        if (activeSub < 3) {
          activeSub++;
        } else if (activeMission < 8) {
          activeMission++;
          activeSub = 1;
        }
      } else if (direction === -1) {
        if (activeSub > 1) {
          activeSub--;
        } else if (activeMission > 1) {
          activeMission--;
          activeSub = 3;
        }
      }
      userSeq = [];
      document.querySelectorAll('.nav-station').forEach((b, idx) => {
        b.classList.toggle('active', (idx + 1) === activeMission);
      });
      renderWorkplace();
    }

    window.onload = () => {
      renderWorkplace();
    };
  </script>
</body>
</html>
